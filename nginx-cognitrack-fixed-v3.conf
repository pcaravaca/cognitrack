server {
    listen 80;
    server_name cognitrack.local 10.10.1.210;

    root /var/www/cognitrack/frontend;
    index index.html;

    # Configuración para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Configuración para archivos estáticos
    location /static/ {
        alias /var/www/cognitrack/static/;
        expires 30d;
        access_log off;
    }

    # Configuración para proxy a la API de backend (Python)
    location /api/v1/ {
        proxy_pass $api_backend_server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Configuración para proxy a la API de Ollama
    location /api/ {
        # Usar la variable $ollama_server definida en ollama_servers.conf
        # Importante: No agregamos /api/ al final ya que /api/ del cliente debe ir directo al servidor Ollama
        proxy_pass $ollama_server/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Configuración CORS
        add_header 'Access-Control-Allow-Origin' 'http://cognitrack.local' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        
        # Manejo de solicitudes OPTIONS (preflight)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://cognitrack.local';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        
        # Manejo de errores para proporcionar mensajes más útiles
        proxy_intercept_errors on;
        error_page 502 504 /error/api_unavailable.html;
    }

    # Configuración para WebSockets del backend
    location /ws/ {
        proxy_pass $api_backend_server/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    
    # Configuración para WebSockets de Ollama
    location /ws/generate {
        # Usar la variable $ollama_server definida en ollama_servers.conf
        proxy_pass $ollama_server/api/generate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        
        # Configuración CORS para WebSockets
        add_header 'Access-Control-Allow-Origin' 'http://cognitrack.local' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
    
    # Directorio para páginas de error personalizadas
    location /error/ {
        alias /var/www/cognitrack/error/;
        internal;
    }

    # Configuración de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Tamaño máximo de subida de archivos
    client_max_body_size 10M;
}

# Incluir configuraciones específicas de servidores Ollama
# Esto permite agregar servidores adicionales sin modificar este archivo
include /etc/nginx/conf.d/ollama_servers.conf;
