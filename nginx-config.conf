# Definición de variables para servidores configurables
map $host $ollama_server_url {
    default 'http://127.0.0.1:11434'; # Valor por defecto local
    # Las URLs específicas se pueden configurar en un archivo incluido
    include /etc/nginx/conf.d/ollama_servers.conf*;
}

server {
    listen 80;
    server_name cognitrack.local 10.10.1.210;

    root /var/www/cognitrack/frontend/dist;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/wasm;
    gzip_disable "MSIE [1-6]\.";

    # Set proper MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuración de WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    location / {
        try_files $uri $uri/ /index.html;
        
        # Set headers for static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }

    # API Proxy para Ollama
    location /api/ {
        # Evitar doble /api/ en las peticiones
        rewrite ^/api/(.*) /$1 break;
        
        # Usar la URL configurada en las variables de entorno
        # Esta variable se debe definir en el archivo de configuración del servidor
        proxy_pass $ollama_server_url/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Log de debugging
        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log debug;
        
        # Timeouts aumentados para LLMs
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Buffer sizes
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
    }

    # WebSocket support para Ollama
    location /ws/ {
        # Evitar doble /api/ en WebSockets
        rewrite ^/ws/(.*) /$1 break;
        
        # Usar la misma variable para WebSockets
        proxy_pass $ollama_server_url/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Log de debugging
        access_log /var/log/nginx/ws_access.log;
        error_log /var/log/nginx/ws_error.log debug;
        
        # Timeouts para conexiones de larga duración
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
