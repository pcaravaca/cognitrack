version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8081"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=8081
      - GO_ENV=development
    restart: unless-stopped
    networks:
      - cognitrack-network

networks:
  cognitrack-network:
    driver: bridge
