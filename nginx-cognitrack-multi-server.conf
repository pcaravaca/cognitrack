# Configuración Nginx para CogniTrack Multi-Server
# Soporta múltiples servidores Ollama con rutas dinámicas

# Incluir configuraciones de servidores
include /etc/nginx/conf.d/ollama_servers.conf;

server {
    listen 80;
    server_name cognitrack.local 192.168.0.105 localhost;
    
    # Configurar logs
    access_log /var/log/nginx/cognitrack_access.log;
    error_log /var/log/nginx/cognitrack_error.log;
    
    # Configuración de seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Configuración de CORS para desarrollo
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    
    # Manejar preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }

    # API Backend - Rutas generales de la aplicación
    location /api/auth/ {
        proxy_pass http://backend_api/api/auth/;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/servers/ {
        proxy_pass http://backend_api/api/servers/;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/users/ {
        proxy_pass http://backend_api/api/users/;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas dinámicas para servidores Ollama específicos
    # /api/server1/, /api/server2/, etc.
    location ~ ^/api/server([0-9]+)/(.*)$ {
        set $server_id $1;
        set $ollama_route $2;
        
        # Determinar el upstream basado en el server_id
        if ($server_id = "1") {
            proxy_pass http://ollama_server1/$ollama_route$is_args$args;
        }
        if ($server_id = "2") {
            proxy_pass http://ollama_server2/$ollama_route$is_args$args;
        }
        if ($server_id = "3") {
            proxy_pass http://ollama_server3/$ollama_route$is_args$args;
        }
        
        # Configuración de proxy para Ollama
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts para operaciones Ollama (pueden ser largas)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering para streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Headers específicos para Ollama
        proxy_set_header Accept "application/json, text/event-stream";
        
        # Error handling
        error_page 502 503 504 /error_pages/api_unavailable.html;
    }

    # Ruta general para Ollama (servidor por defecto)
    location /api/ollama/ {
        proxy_pass http://ollama_server1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        
        error_page 502 503 504 /error_pages/api_unavailable.html;
    }

    # Health check endpoints para cada servidor
    location ~ ^/api/server([0-9]+)/health$ {
        set $server_id $1;
        
        if ($server_id = "1") {
            proxy_pass http://ollama_server1/api/tags;
        }
        if ($server_id = "2") {
            proxy_pass http://ollama_server2/api/tags;
        }
        if ($server_id = "3") {
            proxy_pass http://ollama_server3/api/tags;
        }
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        
        # Respuesta simple para health check
        add_header Content-Type "application/json";
    }

    # Servir archivos estáticos del frontend
    location / {
        root /opt/cognitrack/frontend;
        try_files $uri $uri/ /index.html;
        
        # Cache para archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # No cache para index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Páginas de error personalizadas
    location /error_pages/ {
        root /opt/cognitrack;
        internal;
    }
    
    # Error pages
    error_page 404 /error_pages/404.html;
    error_page 500 502 503 504 /error_pages/api_unavailable.html;
}

# Server block para HTTPS (opcional, para producción)
server {
    listen 443 ssl http2;
    server_name cognitrack.local 192.168.0.105;
    
    # Certificados SSL (reemplazar con certificados reales en producción)
    ssl_certificate /etc/nginx/ssl/cognitrack.crt;
    ssl_certificate_key /etc/nginx/ssl/cognitrack.key;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Mismo contenido que el servidor HTTP
    include /etc/nginx/sites-available/cognitrack-http-content.conf;
}
