    networks:
      - cognitrack-network
    environment:
      - DB_CONNECTION_STRING=Server=10.10.1.21;Database=CogniTrack;User Id=sa;Password=S@pr1ssa;TrustServerCertificate=True;

networks:
  cognitrack-network:
    driver: bridge
