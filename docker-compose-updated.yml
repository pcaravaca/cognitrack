services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cognitrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Mapeo directo al puerto 80
      - "5173:5173"  # Puerto de desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cognitrack-network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://10.10.1.210:8081

  backend:
    build:
      context: ./go-backend  # Cambiado para apuntar al directorio go-backend
      dockerfile: Dockerfile  # Usando el Dockerfile dentro de go-backend
    container_name: cognitrack-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./go-backend:/app
      - /app/vendor
    networks:
      - cognitrack-network
    environment:
      - DB_CONNECTION_STRING=Server=10.10.1.21;Database=CogniTrack;User Id=sa;Password=S@pr1ssa;TrustServerCertificate=True;

networks:
  cognitrack-network:
    driver: bridge:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cognitrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"  # Mapeo directo al puerto 80
      - "5173:5173"  # Puerto de desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cognitrack-network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://10.10.1.210:8081

  backend:
    build:
      context: .
