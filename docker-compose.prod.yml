services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cognitrack-frontend
    container_name: cognitrack-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
    restart: unless-stopped
    networks:
      - cognitrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cognitrack-backend
    container_name: cognitrack-backend
    environment:
      - NODE_ENV=production
      - PORT=8081
    restart: unless-stopped
    networks:
      - cognitrack-network

  nginx:
    image: nginx:alpine
    container_name: cognitrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx:/etc/nginx/conf.d
    networks:
      - cognitrack-network
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

networks:
  cognitrack-network:
    driver: bridge
