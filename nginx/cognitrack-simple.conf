server {
    listen 80;
    server_name 10.10.1.210;  # Usar la IP directamente para pruebas

    # Configuración del cliente
    client_max_body_size 100M;

    # Configuración de logs
    access_log /var/log/nginx/cognitrack.access.log;
    error_log /var/log/nginx/cognitrack.error.log;

    # Configuración de la raíz del sitio
    root /home/peter/cognitrack/frontend/dist;
    index index.html;

    # Configuración para archivos estáticos
    location / {
        try_files $uri $uri/ /index.html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuración para WebSocket
    location /ws/ {
        proxy_pass http://localhost:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Deshabilitar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deshabilitar acceso a archivos sensibles
    location ~* \.(ini|log|conf|sh|git|env|sql)$ {
        deny all;
    }

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
