# Configuración dinámica de servidores Ollama para CogniTrack
# Este archivo es incluido por la configuración principal de Nginx

# Upstream para el backend API
upstream backend_api {
    server localhost:8000;
}

# Upstream para servidores Ollama múltiples
# Estos serán generados dinámicamente por el script de despliegue
upstream ollama_server1 {
    server 10.10.1.210:11434 max_fails=3 fail_timeout=30s;
}

upstream ollama_server2 {
    server 192.168.0.105:11434 max_fails=3 fail_timeout=30s;
}

upstream ollama_server3 {
    server 192.168.0.106:11434 max_fails=3 fail_timeout=30s;
}

# Mapeo dinámico de rutas a servidores específicos
map $uri $ollama_backend {
    ~^/api/server1/(.*)$ ollama_server1;
    ~^/api/server2/(.*)$ ollama_server2;
    ~^/api/server3/(.*)$ ollama_server3;
    default ollama_server1;
}

# Mapeo para extraer la ruta después del identificador del servidor
map $uri $ollama_path {
    ~^/api/server[0-9]+/(.*)$ /$1;
    ~^/api/ollama/(.*)$ /$1;
    default $uri;
}

# Health check endpoints
map $uri $is_health_check {
    ~^/api/server[0-9]+/health$ 1;
    ~^/health$ 1;
    default 0;
}
