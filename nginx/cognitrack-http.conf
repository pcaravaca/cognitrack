server {
    listen 80;
    server_name cognitrack.local;  # Cambia esto por tu dominio real o IP

    # Configuración del proxy inverso
    location / {
        proxy_pass http://localhost:3000;  # Puerto donde corre tu aplicación
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuración para archivos estáticos
    location /static/ {
        alias /var/www/cognitrack/static/;
        expires 30d;
        access_log off;
    }

    # Configuración para archivos de medios
    location /media/ {
        alias /var/www/cognitrack/media/;
        expires 30d;
        access_log off;
    }

    # Configuración de logs
    access_log /var/log/nginx/cognitrack_access.log;
    error_log /var/log/nginx/cognitrack_error.log;

    # Configuración de seguridad adicional
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Tamaño máximo de subida de archivos
    client_max_body_size 10M;
}
