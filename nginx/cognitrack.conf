server {
    listen 80;
    server_name cognitrack.local;  # Cambia esto por tu dominio real

    # Redirección HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cognitrack.local;  # Cambia esto por tu dominio real

    # Configuración SSL - Asegúrate de tener tus certificados
    ssl_certificate /etc/ssl/certs/cognitrack.crt;
    ssl_certificate_key /etc/ssl/private/cognitrack.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Configuración del proxy inverso
    location / {
        proxy_pass http://localhost:3000;  # Puerto donde corre tu aplicación
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuración para archivos estáticos
    location /static/ {
        alias /var/www/cognitrack/static/;
        expires 30d;
        access_log off;
    }

    # Configuración para archivos de medios
    location /media/ {
        alias /var/www/cognitrack/media/;
        expires 30d;
        access_log off;
    }

    # Configuración de logs
    access_log /var/log/nginx/cognitrack_access.log;
    error_log /var/log/nginx/cognitrack_error.log;

    # Configuración de seguridad adicional
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Tamaño máximo de subida de archivos
    client_max_body_size 10M;
}
