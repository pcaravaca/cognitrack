# Configuración para {{APP_NAME}} en {{APP_DOMAIN}}
server {
    listen 80;
    server_name {{APP_DOMAIN}};

    # Redirección HTTP a HTTPS (opcional, requiere certificados SSL)
    # return 301 https://$host$request_uri;

    # Configuración de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin";
    add_header Content-Security-Policy "default-src 'self';";

    # Configuración del proxy inverso
    location / {
        proxy_pass http://{{APP_CONTAINER}}:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Configuración para archivos estáticos
    location /static/ {
        alias /var/www/{{APP_NAME}}/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Configuración para archivos de medios
    location /media/ {
        alias /var/www/{{APP_NAME}}/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Configuración de logs
    access_log /var/log/nginx/{{APP_NAME}}_access.log;
    error_log /var/log/nginx/{{APP_NAME}}_error.log;

    # Configuración para WebSockets
    location /ws/ {
        proxy_pass http://{{APP_CONTAINER}}:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Deshabilitar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
