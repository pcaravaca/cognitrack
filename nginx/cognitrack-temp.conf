server {
    listen 80;
    server_name _;
    root /var/www/cognitrack/frontend/dist;
    index index.html;

    # Configuración de logs
    access_log /var/log/nginx/cognitrack_access.log;
    error_log /var/log/nginx/cognitrack_error.log;

    # Configuración de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Tamaño máximo de subida de archivos
    client_max_body_size 10M;

    # Configuración para archivos estáticos
    location / {
        try_files $uri $uri/ /index.html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuración para archivos estáticos
    location /static/ {
        alias /var/www/cognitrack/static/;
        expires 30d;
        access_log off;
    }

    # Configuración para archivos de medios
    location /media/ {
        alias /var/www/cognitrack/media/;
        expires 30d;
        access_log off;
    }
}
